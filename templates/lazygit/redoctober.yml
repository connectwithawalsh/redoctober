# Red October for lazygit. Merge this gui.theme block into your config.yml, or load this file
# next to it: LG_CONFIG_FILE="/path/to/config.yml,/path/to/redoctober.yml" lazygit
gui:
  theme:
    activeBorderColor:
      - '{{alarm}}'
      - bold
    inactiveBorderColor:
      - '{{bulkhead}}'
    searchingActiveBorderColor:
      - '{{brass}}'
      - bold
    optionsTextColor:
      - '{{steel}}'
    selectedLineBgColor:
      - '{{bezel}}'
    inactiveViewSelectedLineBgColor:
      - '{{panel}}'
    cherryPickedCommitFgColor:
      - '{{abyss}}'
    cherryPickedCommitBgColor:
      - '{{dusk}}'
    markedBaseCommitFgColor:
      - '{{abyss}}'
    markedBaseCommitBgColor:
      - '{{brass}}'
    unstagedChangesColor:
      - '{{alarm}}'
    defaultFgColor:
      - '{{chart}}'
    authorColors:
      '*': '{{steel}}'
